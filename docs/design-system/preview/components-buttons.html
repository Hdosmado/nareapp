<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn { display:inline-flex; align-items:center; justify-content:center; border:none; cursor:pointer; padding:0 20px; font-family:var(--font-body); user-select:none; }
.btn-critical { height:64px; min-width:280px; background:var(--coral-600); color:#fff; border-radius:20px; font-weight:700; font-size:20px; letter-spacing:0.06em; text-transform:uppercase; box-shadow:0 4px 14px rgba(20,20,20,0.08); }
.btn-primary { height:56px; min-width:200px; background:var(--teal-700); color:#fff; border-radius:18px; font-weight:700; font-size:18px; letter-spacing:0.06em; text-transform:uppercase; }
.btn-secondary { height:48px; background:var(--sand-0); color:var(--teal-700); border:1.5px solid var(--teal-700); border-radius:14px; font-weight:600; font-size:16px; }
.btn-ghost { height:44px; background:transparent; color:var(--teal-700); border-radius:10px; font-weight:600; font-size:16px; padding:0 12px;}
.lbl { font:600 11px/1 var(--font-body); color:var(--ink-600); letter-spacing:0.06em; text-transform:uppercase; margin-top:8px; }
.col2 { display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
</style>
</head>
<body><div class="card">
  <div class="row" style="gap:18px; align-items:flex-end;">
    <div class="col2"><button class="btn btn-critical">LLEGUÉ</button><div class="lbl">Crítico · único uso</div></div>
    <div class="col2"><button class="btn btn-primary">FIN DE SERVICIO</button><div class="lbl">Primario · acción operativa</div></div>
  </div>
  <div class="row" style="gap:14px; align-items:flex-end;">
    <div class="col2"><button class="btn btn-secondary">Ver mapa</button><div class="lbl">Secundario</div></div>
    <div class="col2"><button class="btn btn-ghost">Ver detalle</button><div class="lbl">Ghost</div></div>
    <div class="col2"><button class="btn btn-secondary" disabled style="opacity:0.4;">Confirmar</button><div class="lbl">Disabled (opacity 0.4)</div></div>
  </div>
</div></body></html>
