<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.swatch { display:flex; flex-direction:column; gap:6px; flex:1; min-width:90px; }
.chip { height:80px; border-radius:12px; border:1px solid rgba(0,0,0,0.06); }
.name { font:600 13px/1 var(--font-body); color:var(--ink-900); }
.hex { font:500 11px/1 var(--font-mono); color:var(--ink-600); }
</style>
</head>
<body><div class="card">
  <div class="row" style="gap:10px;">
    <div class="swatch"><div class="chip" style="background:#062F2F"></div><div class="name">teal/900</div><div class="hex">#062F2F</div></div>
    <div class="swatch"><div class="chip" style="background:#084343"></div><div class="name">teal/800</div><div class="hex">#084343</div></div>
    <div class="swatch"><div class="chip" style="background:#0E5C5C; outline:2px solid var(--coral-600); outline-offset:-6px;"></div><div class="name">teal/700 · marca</div><div class="hex">#0E5C5C</div></div>
    <div class="swatch"><div class="chip" style="background:#157777"></div><div class="name">teal/600</div><div class="hex">#157777</div></div>
    <div class="swatch"><div class="chip" style="background:#1F9494"></div><div class="name">teal/500</div><div class="hex">#1F9494</div></div>
    <div class="swatch"><div class="chip" style="background:#5BB6B6"></div><div class="name">teal/400</div><div class="hex">#5BB6B6</div></div>
    <div class="swatch"><div class="chip" style="background:#C0E0E0"></div><div class="name">teal/200</div><div class="hex">#C0E0E0</div></div>
    <div class="swatch"><div class="chip" style="background:#E0EFEF"></div><div class="name">teal/100</div><div class="hex">#E0EFEF</div></div>
    <div class="swatch"><div class="chip" style="background:#F0F7F7"></div><div class="name">teal/50</div><div class="hex">#F0F7F7</div></div>
  </div>
  <div class="tag">Marca · Teal — confianza, salud, profesionalismo</div>
</div></body></html>
