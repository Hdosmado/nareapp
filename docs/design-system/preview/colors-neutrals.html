<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.swatch { display:flex; flex-direction:column; gap:6px; flex:1; min-width:78px; }
.chip { height:64px; border-radius:10px; border:1px solid rgba(0,0,0,0.06); }
.name { font:600 12px/1 var(--font-body); color:var(--ink-900); }
.hex { font:500 10px/1 var(--font-mono); color:var(--ink-600); }
</style>
</head>
<body><div class="card" style="gap:14px;">
  <div class="col" style="gap:8px;">
    <div class="tag">Ink — texto, bordes</div>
    <div class="row" style="gap:8px;">
      <div class="swatch"><div class="chip" style="background:#141414"></div><div class="name">ink/900</div><div class="hex">#141414</div></div>
      <div class="swatch"><div class="chip" style="background:#2A2724"></div><div class="name">ink/800</div><div class="hex">#2A2724</div></div>
      <div class="swatch"><div class="chip" style="background:#443F39"></div><div class="name">ink/700</div><div class="hex">#443F39</div></div>
      <div class="swatch"><div class="chip" style="background:#6B645C"></div><div class="name">ink/600</div><div class="hex">#6B645C</div></div>
      <div class="swatch"><div class="chip" style="background:#8A8278"></div><div class="name">ink/500</div><div class="hex">#8A8278</div></div>
      <div class="swatch"><div class="chip" style="background:#ADA59B"></div><div class="name">ink/400</div><div class="hex">#ADA59B</div></div>
      <div class="swatch"><div class="chip" style="background:#CFC8BE"></div><div class="name">ink/300</div><div class="hex">#CFC8BE</div></div>
      <div class="swatch"><div class="chip" style="background:#E5DFD5"></div><div class="name">ink/200</div><div class="hex">#E5DFD5</div></div>
    </div>
  </div>
  <div class="col" style="gap:8px;">
    <div class="tag">Sand — fondos, superficies</div>
    <div class="row" style="gap:8px;">
      <div class="swatch"><div class="chip" style="background:#FFFFFF"></div><div class="name">sand/0</div><div class="hex">#FFFFFF</div></div>
      <div class="swatch"><div class="chip" style="background:#F7F4EE"></div><div class="name">sand/50 · bg</div><div class="hex">#F7F4EE</div></div>
      <div class="swatch"><div class="chip" style="background:#EFEAE1"></div><div class="name">sand/100</div><div class="hex">#EFEAE1</div></div>
      <div class="swatch"><div class="chip" style="background:#E5DFD5"></div><div class="name">sand/200</div><div class="hex">#E5DFD5</div></div>
    </div>
  </div>
</div></body></html>
