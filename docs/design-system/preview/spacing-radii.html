<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.box { background:var(--teal-100); border:1px solid var(--teal-200); width:84px; height:84px; display:flex; align-items:flex-end; justify-content:center; padding:8px; }
.lbl { font:600 12px/1 var(--font-body); color:var(--ink-900); }
.px { font:500 11px/1 var(--font-mono); color:var(--ink-600); }
.col2 { display:flex; flex-direction:column; align-items:center; gap:6px; }
</style>
</head>
<body><div class="card">
  <div class="row" style="gap:14px;">
    <div class="col2"><div class="box" style="border-radius:4px;"></div><div class="lbl">xs · 4</div></div>
    <div class="col2"><div class="box" style="border-radius:8px;"></div><div class="lbl">sm · 8</div></div>
    <div class="col2"><div class="box" style="border-radius:14px;"></div><div class="lbl">md · 14 · cards</div></div>
    <div class="col2"><div class="box" style="border-radius:20px;"></div><div class="lbl">lg · 20 · botones</div></div>
    <div class="col2"><div class="box" style="border-radius:28px;"></div><div class="lbl">xl · 28</div></div>
    <div class="col2"><div class="box" style="border-radius:999px;"></div><div class="lbl">pill · 999</div></div>
  </div>
</div></body></html>
