<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row-spc { display:flex; align-items:center; gap:14px; }
.bar { background:var(--teal-100); border-radius:4px; height:18px; }
.lbl { font:600 12px/1 var(--font-body); color:var(--ink-900); min-width:44px; }
.px { font:500 11px/1 var(--font-mono); color:var(--ink-600); }
</style>
</head>
<body><div class="card" style="gap:6px;">
  <div class="row-spc"><div class="lbl">1</div><div class="bar" style="width:4px;"></div><div class="px">4 px</div></div>
  <div class="row-spc"><div class="lbl">2</div><div class="bar" style="width:8px;"></div><div class="px">8 px</div></div>
  <div class="row-spc"><div class="lbl">3</div><div class="bar" style="width:12px;"></div><div class="px">12 px</div></div>
  <div class="row-spc"><div class="lbl">4</div><div class="bar" style="width:16px;"></div><div class="px">16 px · default</div></div>
  <div class="row-spc"><div class="lbl">5</div><div class="bar" style="width:24px;"></div><div class="px">24 px</div></div>
  <div class="row-spc"><div class="lbl">6</div><div class="bar" style="width:32px;"></div><div class="px">32 px</div></div>
  <div class="row-spc"><div class="lbl">7</div><div class="bar" style="width:48px;"></div><div class="px">48 px</div></div>
  <div class="row-spc"><div class="lbl">8</div><div class="bar" style="width:64px;"></div><div class="px">64 px</div></div>
  <div class="row-spc"><div class="lbl">9</div><div class="bar" style="width:96px;"></div><div class="px">96 px</div></div>
  <div class="tag" style="margin-top:8px;">Spacing · sistema 4pt</div>
</div></body></html>
