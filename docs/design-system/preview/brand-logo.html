<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
.panel { display:flex; align-items:center; justify-content:center; border-radius:14px; padding:24px; min-height:140px; }
.cap { font:600 11px/1 var(--font-body); letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-600); margin-top:8px; }
</style></head>
<body><div class="card">
  <div class="row">
    <div>
      <div class="panel" style="background:var(--sand-0); border:1px solid var(--ink-200);"><img src="../assets/logo.svg" style="height:64px;" alt=""/></div>
      <div class="cap">Logo · sobre sand/0</div>
    </div>
    <div>
      <div class="panel" style="background:var(--teal-700);"><img src="../assets/logo-mono-light.svg" style="height:64px;" alt=""/></div>
      <div class="cap">Mono claro · sobre marca</div>
    </div>
  </div>
  <div class="row">
    <div>
      <div class="panel" style="background:var(--sand-50);"><img src="../assets/logo-mono-dark.svg" style="height:48px;" alt=""/></div>
      <div class="cap">Mono oscuro</div>
    </div>
    <div>
      <div class="panel" style="background:var(--sand-50);"><img src="../assets/app-icon.svg" style="height:80px; border-radius:18px;" alt=""/></div>
      <div class="cap">App icon · logomark</div>
    </div>
  </div>
</div></body></html>
