<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.swatch { display:flex; flex-direction:column; gap:6px; flex:1; min-width:100px; }
.chip { height:96px; border-radius:12px; border:1px solid rgba(0,0,0,0.06); }
.name { font:600 13px/1 var(--font-body); color:var(--ink-900); }
.hex { font:500 11px/1 var(--font-mono); color:var(--ink-600); }
</style>
</head>
<body><div class="card">
  <div class="row" style="gap:10px;">
    <div class="swatch"><div class="chip" style="background:#B83E29"></div><div class="name">coral/700</div><div class="hex">#B83E29</div></div>
    <div class="swatch"><div class="chip" style="background:#D9533B"></div><div class="name">coral/600 · crítico</div><div class="hex">#D9533B</div></div>
    <div class="swatch"><div class="chip" style="background:#E4715C"></div><div class="name">coral/500</div><div class="hex">#E4715C</div></div>
    <div class="swatch"><div class="chip" style="background:#FAE0DA"></div><div class="name">coral/100</div><div class="hex">#FAE0DA</div></div>
    <div class="swatch"><div class="chip" style="background:#FCEFEB"></div><div class="name">coral/50</div><div class="hex">#FCEFEB</div></div>
  </div>
  <div class="muted" style="font-size:13px; line-height:1.45;">
    Reservado a la acción crítica <b style="font-family:var(--font-body); font-weight:700; color:var(--coral-600);">LLEGUÉ</b> y a errores graves. <b>No</b> usar en estados, links, o decoración — la rareza es la jerarquía.
  </div>
</div></body></html>
