<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.field { display:flex; flex-direction:column; gap:6px; }
.label { font:600 13px/1 var(--font-body); color:var(--ink-800); }
.input { height:52px; padding:0 16px; border-radius:14px; border:1.5px solid var(--ink-200); background:var(--sand-0); font-family:var(--font-body); font-size:16px; color:var(--ink-900); outline:none; }
.input:focus { border-color:var(--teal-500); box-shadow:0 0 0 3px var(--teal-100); }
.input.error { border-color:var(--coral-600); }
.help { font:500 12px/1.3 var(--font-body); color:var(--ink-600); }
.help.err { color:var(--coral-700); }
</style>
</head>
<body><div class="card">
  <div class="row" style="align-items:flex-start; gap:24px;">
    <div class="field" style="flex:1;">
      <div class="label">Usuario</div>
      <input class="input" value="m.cabrera" />
      <div class="help">Usado para iniciar sesión.</div>
    </div>
    <div class="field" style="flex:1;">
      <div class="label">Contraseña</div>
      <input class="input" value="••••••••" type="password" />
      <div class="help">8 caracteres o más.</div>
    </div>
  </div>
  <div class="row" style="align-items:flex-start; gap:24px;">
    <div class="field" style="flex:1;">
      <div class="label">Motivo (excepción)</div>
      <input class="input" placeholder="Ej: domicilio nuevo no cargado" />
    </div>
    <div class="field" style="flex:1;">
      <div class="label">PIN</div>
      <input class="input error" value="0000" />
      <div class="help err">PIN incorrecto. Probá de nuevo.</div>
    </div>
  </div>
</div></body></html>
