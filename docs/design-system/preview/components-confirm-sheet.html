<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.scrim { background:rgba(20,20,20,0.4); padding:32px 24px; border-radius:14px; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--sand-0); border-radius:20px; padding:24px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:14px; box-shadow:0 12px 32px rgba(20,20,20,0.12); }
.ico { width:48px; height:48px; border-radius:999px; background:var(--state-llegue-bg); display:flex; align-items:center; justify-content:center; color:var(--state-llegue-dot); }
.h { font:700 22px/1.2 var(--font-body); color:var(--ink-900); letter-spacing:-0.01em; }
.p { font:400 15px/1.45 var(--font-body); color:var(--ink-700); }
.btn { height:52px; border:none; border-radius:14px; background:var(--teal-700); color:#fff; font:700 16px/1 var(--font-body); cursor:pointer; }
</style>
</head>
<body><div class="card flush" style="background:var(--sand-50); padding:14px;">
  <div class="scrim">
    <div class="sheet">
      <div class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div class="h">Llegada registrada</div>
      <div class="p">10:47 — Cabrera, María Elena. La hora se envió a coordinación.</div>
      <button class="btn">Continuar</button>
    </div>
  </div>
</div></body></html>
