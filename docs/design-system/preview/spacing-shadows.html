<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.tile { width:140px; height:96px; background:var(--sand-0); border:1px solid var(--ink-200); border-radius:14px; display:flex; align-items:center; justify-content:center; font:600 13px/1 var(--font-body); color:var(--ink-700); }
.col2 { display:flex; flex-direction:column; gap:8px; }
.px { font:500 11px/1 var(--font-mono); color:var(--ink-600); }
</style>
</head>
<body><div class="card" style="background:var(--sand-50);">
  <div class="row" style="gap:18px;">
    <div class="col2"><div class="tile" style="box-shadow:none; border-color:var(--ink-200);">flat</div><div class="px">— · sin sombra</div></div>
    <div class="col2"><div class="tile" style="box-shadow:0 1px 2px rgba(20,20,20,0.06); border:none;">sm</div><div class="px">cards</div></div>
    <div class="col2"><div class="tile" style="box-shadow:0 4px 14px rgba(20,20,20,0.08); border:none;">md</div><div class="px">botones, sheets</div></div>
    <div class="col2"><div class="tile" style="box-shadow:0 12px 32px rgba(20,20,20,0.12); border:none;">lg</div><div class="px">modales</div></div>
  </div>
  <div class="muted" style="font-size:13px;">Mínimo por filosofía — Android de gama baja renderiza sombras costosas. Sin shadows internas, sin glow, sin neumorfismo.</div>
</div></body></html>
