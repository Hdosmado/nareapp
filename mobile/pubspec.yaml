name: nareapp_mobile
description: "NareApp - app del prestador de cuidado domiciliario"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase: core para inicialización y messaging para FCM (push).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Notificaciones locales (banner heads-up cuando la app está en foreground
  # y para usar un canal Android de alta importancia con FCM).
  flutter_local_notifications: ^18.0.1

  # Mapa embebido en la pantalla "Cómo llegar". La API key se inyecta por
  # `--dart-define=GOOGLE_MAPS_API_KEY=...` y se aplica via manifest
  # placeholder en Android y `GMSServices.provideAPIKey` en iOS.
  google_maps_flutter: ^2.9.0

  # Estado.
  flutter_riverpod: ^2.6.1

  # Cliente HTTP con interceptores (JWT, refresh).
  dio: ^5.7.0

  # Almacenamiento seguro del JWT.
  flutter_secure_storage: ^9.2.4

  # Persistencia local de la cola offline y la config.
  shared_preferences: ^2.3.3

  # Deep link a Google Maps (geo:) y links de privacidad.
  url_launcher: ^6.3.1

  # Detección de conectividad para el modo offline-first.
  connectivity_plus: ^6.1.0

  # GPS de la ventana pre-servicio (con foreground service en Android).
  geolocator: ^13.0.2

  # Identidad del dispositivo (deviceId, modelo, versión de SO).
  device_info_plus: ^11.1.0

  # Claves de idempotencia y deviceId estable.
  uuid: ^4.5.1

  # Escaneo de QR (mecanismo secundario de activación).
  # Deshabilitado temporalmente: GoogleMLKit no soporta arm64 en simulador iOS
  # (Apple Silicon). La activación principal es por código de 8 dígitos.
  # mobile_scanner: ^6.0.10

  # Tipografías de marca (Bricolage Grotesque, Plus Jakarta Sans, JetBrains Mono).
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Genera los íconos de launcher (Android adaptativo + iOS) desde el arte de
  # marca. Correr: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    # Logomark transparente para uso in-app (splash, activación, app bar).
    - assets/brand/logo.png

# Ícono de la app, generado desde el arte de marca. El arte ya trae su recuadro
# crema sobre fondo transparente, así que sirve como imagen base y como capa
# frontal del ícono adaptativo de Android; el fondo adaptativo usa el crema del
# logo para que los bordes enmascarados queden parejos.
flutter_launcher_icons:
  image_path: "assets/brand/app-icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FBEFE7"
  adaptive_icon_foreground: "assets/brand/app-icon.png"
  web:
    generate: false
